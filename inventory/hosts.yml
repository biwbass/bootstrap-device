---
all:
  children:
    control_plane:
      hosts:
        k8s-cp: # Ubuntu Server 26.04 control-plane VM
          ansible_host: control-plane.k8s.internal
    workers:
      hosts:
        pi5-gpio:
          ansible_host: gpio.k8s.internal
        pi5-ml:
          ansible_host: ml.k8s.internal
        # Proxmox VM 201: Ryzen 5800X host, amd64, Ubuntu 24.04 (not 26.04:
        # the NVIDIA GPU Operator support matrix does not list 26.04 yet).
        # The first non-Pi, non-arm64 worker; see issue #57.
        gpu-worker:
          ansible_host: gpu.k8s.internal
    # The Pi workers, for plays that only make sense on Raspberry Pi OS (the
    # Pi MOTD, xRDP). `workers` is every Kubernetes worker whatever its
    # hardware, so Pi-only plays must not target it.
    raspberry_pi:
      hosts:
        pi5-gpio: {}
        pi5-ml: {}
    # GPU workers. Tainted at registration (inventory/group_vars/gpu.yml), so
    # only pods that tolerate the taint ever land on them.
    gpu:
      hosts:
        gpu-worker: {}
    ml:
      hosts:
        pi5-ml: {}
    vm_host:
      # The Mac that runs the UTM control-plane VM. Only
      # playbooks/vm-host-lifecycle.yml targets it. Add the host here, and set
      # utm_vm_name in inventory/group_vars/vm_host.yml.
      hosts:
        mini:
          ansible_host: mini.internal
    inference:
      # Apple-Silicon Mac serving MLX inference (mlx-openai-server) to the
      # cluster. Not a Kubernetes node — only playbooks/mlx-inference.yml
      # targets it.
      hosts:
        pi-dev:
          ansible_host: pi.dev
          ansible_python_interpreter: /usr/bin/python3
